# Publishes Rubies to GitHub Pages (https://hachadwick.github.io/Rubies/) every time main is pushed,
# after the tests pass. People install it from that address: Safari → Share → Add to Home Screen on iPad,
# Chrome → Install app on Android.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push replaces one that's waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The desktop app's Electron download isn't needed to build the website.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
